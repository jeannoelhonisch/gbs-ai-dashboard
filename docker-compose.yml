services:
  ai-dashboard:
    image: ai-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-dashboard
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - DATA_ROOT=/data
      - PORT=3030
    volumes:
      # Mount your actual repo directories as read-only into /data
      # Adjust the left side (host paths) to where the repos live on the VM
      - /opt/repos/Sonarqube-Autofix:/data/Sonarqube-Autofix:ro
      - /opt/repos/test-platform-framework:/data/test-platform-framework:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
